# 1단계: 11개 엔드포인트 스펙 파일 생성 ($HOME/openapi-spec.yaml)
# cat << 'EOF' > $HOME/openapi-spec.yaml
swagger: "2.0"
info:
  title: "SPS Gemini Agent & MCP Integrated Gateway"
  description: "FastAPI LangGraph Agent와 SPS Harness MCP 서버를 완벽 통합 제공하는 11개 엔드포인트 Gateway"
  version: "1.0.0"
schemes:
  - "https"
produces:
  - "application/json"
consumes:
  - "application/json"
paths:
  # 1. MCP Core 엔드포인트 (GET / POST)
  /mcp:
    get:
      operationId: "getMcp"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/mcp"
        path_translation: CONSTANT_ADDRESS
        deadline: 600.0
      responses:
        200:
          description: "성공"
    post:
      operationId: "postMcp"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/mcp"
        path_translation: CONSTANT_ADDRESS
        deadline: 600.0
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
      responses:
        200:
          description: "성공"

  # 2. MCP SSE 엔드포인트
  /sse:
    get:
      operationId: "getSse"
      produces:
        - "text/event-stream"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/sse"
        path_translation: CONSTANT_ADDRESS
        deadline: 600.0
      responses:
        200:
          description: "성공"

  # 3. MCP Messages 엔드포인트
  /messages:
    post:
      operationId: "postMessages"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/messages"
        path_translation: CONSTANT_ADDRESS
        deadline: 600.0
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
      responses:
        200:
          description: "성공"

  # 4. OAuth Authorize 엔드포인트
  /authorize:
    get:
      operationId: "getAuthorize"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/authorize"
        path_translation: CONSTANT_ADDRESS
        deadline: 60.0
      responses:
        200:
          description: "성공"

  # 5. OAuth Token 엔드포인트
  /token:
    post:
      operationId: "postToken"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/token"
        path_translation: CONSTANT_ADDRESS
        deadline: 60.0
      responses:
        200:
          description: "성공"

  # 6. OpenID Configuration 엔드포인트
  /.well-known/openid-configuration:
    get:
      operationId: "getOpenIdConfig"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/.well-known/openid-configuration"
        path_translation: CONSTANT_ADDRESS
        deadline: 60.0
      responses:
        200:
          description: "성공"

  # 7. OAuth Authorization Server 엔드포인트 (ChatGPT 필수)
  /.well-known/oauth-authorization-server:
    get:
      operationId: "getOauthAuthServer"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/.well-known/oauth-authorization-server"
        path_translation: CONSTANT_ADDRESS
        deadline: 60.0
      responses:
        200:
          description: "성공"

  # 8. OAuth Protected Resource 엔드포인트
  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: "getOauthResourceMcp"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/.well-known/oauth-protected-resource/mcp"
        path_translation: CONSTANT_ADDRESS
        deadline: 60.0
      responses:
        200:
          description: "성공"

  # 9. Gmail Read 엔드포인트
  /gmail/read:
    get:
      operationId: "readRecentEmails"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/gmail/read"
        path_translation: CONSTANT_ADDRESS
        deadline: 60.0
      parameters:
        - name: "max_results"
          in: "query"
          required: false
          type: "integer"
          default: 3
      responses:
        200:
          description: "성공"

  # 10. Gmail Send 엔드포인트
  /gmail/send:
    post:
      operationId: "sendGmail"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/gmail/send"
        path_translation: CONSTANT_ADDRESS
        deadline: 60.0
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
      responses:
        200:
          description: "성공"

  # 11. SPS Agent Chat 엔드포인트
  /agent/chat:
    post:
      operationId: "chatWithSpsAgent"
      x-google-backend:
        address: "https://subprime-glowworm-mundane.ngrok-free.dev/agent/chat"
        path_translation: CONSTANT_ADDRESS
        deadline: 600.0
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
      responses:
        200:
          description: "성공"
# EOF

